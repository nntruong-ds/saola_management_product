spring.application.name=demo36
server.port = 8083
# ket noi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/demo36?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# update = tu tao va sua bang
spring.jpa.show-sql=true
# hienj cau sql trong console de debug
spring.jpa.properties.hibernate.format_sql=true
spring.security.user.name=admin
spring.security.user.password=123456